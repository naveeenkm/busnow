<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>BusNow — Find Your Next Bus</title>
    <meta name="description" content="Search intercity bus timings between cities, track the next departure in real time, save favourite routes, and never miss your bus." />
    <meta name="keywords" content="bus timings, intercity bus, next bus, bus schedule, bus tracker, city bus" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BusNow — Find Your Next Bus" />
    <meta property="og:description" content="Search intercity bus timings, track the next departure in real time, and never miss your bus." />
    <meta property="og:site_name" content="BusNow" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="BusNow — Find Your Next Bus" />
    <meta name="twitter:description" content="Search intercity bus timings, track the next departure in real time, and never miss your bus." />

    <!-- Theme / PWA hints -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="canonical" href="https://busnow.app/" />

    <!-- Structured data for Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "BusNow",
      "url": "https://busnow.app",
      "description": "Search intercity bus timings, track the next departure in real time, and never miss your bus.",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "All"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
